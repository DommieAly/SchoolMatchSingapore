# What differs from compose.yaml when the production files run on a laptop (docs/deployment.md, step 1):
#   ./make-rehearsal-files.sh
#   docker compose --project-directory .rehearsal -f compose.yaml -f rehearsal.override.yaml up -d --build --wait
#   ../rehearsal/smoke.sh
#   docker compose --project-directory .rehearsal -f compose.yaml -f rehearsal.override.yaml down -v
# .rehearsal/ (gitignored) stands in for /opt/schoolmatch, so .env and certs/ are its throwaway copies and every path
# here starts from it. Its .env says SITE_ADDRESS=localhost, and for that name Caddy issues the certificate from its own
# internal authority (the same as "tls internal") instead of asking Let's Encrypt. Browsers warn about it.
name: sm-lightsail-rehearsal
services:
  app:
    build: ../../..
    environment:
      GOOGLE_MODE: stub      # no calls to Google or OneMap
      ONEMAP_MODE: stub
  proxy:
    ports: !override
      - "127.0.0.1:8443:443"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
