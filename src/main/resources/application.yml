# SchoolMatch SG — shared settings. Profile files (application-<profile>.yml) override these.
# Keys and modes come from environment variables or a local .env file (never commit keys).
spring:
  application:
    name: schoolmatch
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      # Flyway creates and upgrades the tables (src/main/resources/db/migration); Hibernate only checks at start-up
      # that every entity matches them and changes nothing. A mismatch stops start-up (docs/database-design.md, section 8).
      ddl-auto: validate
  thymeleaf:
    cache: true            # dev turns this off so template edits show on refresh

# Spring Boot Actuator: only health and info are reachable over HTTP (/actuator/health, /actuator/info).
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true        # show the info.* values below on /actuator/info

info:
  app:                     # filled in from pom.xml at build time (Maven resource filtering, @...@)
    name: "@project.name@"
    description: "@project.description@"
    version: "@project.version@"
    java: "@java.version@"

server:
  error:
    whitelabel:
      enabled: false
  compression:             # gzip large answers: the filter page (~480 KB with 147 schools) and /api/districts (~120 KB)
    enabled: true
    mime-types: text/html,text/css,text/plain,text/javascript,application/javascript,application/json,application/geo+json,image/svg+xml
  servlet:
    session:
      tracking-modes: cookie   # never put ;jsessionid=… in URLs (the HTTP session holds flash messages and the start location)
      cookie:
        same-site: lax

# Bound to sg.schoolmatch.config.AppProperties (every value also has a default there).
app:
  external:                # "live" = real API calls; "stub" (or empty) = offline made-up / sample data
    google:
      mode: ${GOOGLE_MODE:stub}
    onemap:
      mode: ${ONEMAP_MODE:stub}
    datagovsg:
      mode: stub
    budget:                # daily limit for LIVE Google calls = floor(monthly-free × safety ÷ 30), at least 1
      safety: 0.8
      zone: America/Los_Angeles   # the budget day; Google resets daily quotas at midnight Pacific Time
      monthly-free:        # Google's free usage per month per SKU, checked 2026-10-03 on
                           # https://developers.google.com/maps/billing-and-pricing/pricing and
                           # https://developers.google.com/maps/documentation/routes/usage-and-billing
        routes: 10000                  # Compute Routes Essentials (requests)
        route-matrix-elements: 10000   # Compute Route Matrix Essentials (elements)
        places-search: 5000            # Nearby Search Pro and Text Search Pro (5,000 each; one shared counter)
        place-details: 1000            # Place Details Enterprise
        map-loads: 10000               # Dynamic Maps Essentials
  google:
    server-key: ${GOOGLE_MAPS_SERVER_KEY:}     # Routes + Places, server side only
    browser-key: ${GOOGLE_MAPS_BROWSER_KEY:}   # Maps JavaScript API, HTTP-referrer restricted
    map-id: ${GOOGLE_MAPS_MAP_ID:}
    matrix-batch-size: 100
    routes-base-url: https://routes.googleapis.com
    places-base-url: https://places.googleapis.com
  onemap:
    base-url: https://www.onemap.gov.sg
  datagovsg:
    api-key: ${DATAGOVSG_API_KEY:}
    base-url: https://data.gov.sg                    # datastore_search
    open-api-base-url: https://api-open.data.gov.sg  # poll-download (planning-area GeoJSON)
  http:                    # timeouts for every outside call (config/RestClientConfig)
    connect-timeout: 5s
    read-timeout: 15s
  dataset:
    dir: data/snapshots    # data/snapshots/ACTIVE names the snapshot folder to load
    # DC-83: the school data is served from the database. At start-up the ACTIVE snapshot is validated and loaded
    # into it unless it is already the active version (docs/database-design.md, section 6.2).
    load-on-startup: true  # false = read no snapshot file; build the cache from the database on first use (import profile)
    allow-rollback: true   # false = a snapshot older than the database's active version is not loaded (prod)
    recheck-after: 1h      # how often the database's active version is checked (another instance may load a newer one)
    import-output-dir: ""  # where the importer writes a new snapshot; empty = dir
    activate-on-import: false   # true = a successful import also updates ACTIVE
    curated-dir: data/curated   # hand-maintained CSVs read by the importer (CuratedCsvReader, @Value)
  session:
    cookie-name: SM_SESSION
    idle-timeout: 30m
    cleanup-interval: 1h   # how often logged-out and expired login sessions are deleted (AuthController, DC-73)
    cookie-secure: false   # set true whenever the app is served over HTTPS (NFR-SEC-03)
  facility:
    cache-ttl: 24h         # radius options (1/2/3 km) are FacilityFilterCriteria constants (DC-24)
  recommendation:
    weights:
      psle-fit: 0.4
      commute: 0.3
      cca: 0.15
      programme: 0.15
    commute-candidates: 20
    top-n: 10
    psle-fit:              # PSLE_FIT score per label (docs/recommendation-scoring.md)
      match: 1.0
      safe: 0.7
      reach-near: 0.3
    reach-near-margin: 2   # a REACH school still counts while score <= U + 2
  search:
    page-size: 20
  transport-filter:        # travel-time filter (FilterController): straight-line pre-check before routing
    max-speed-kmh:         # a school farther than speed x time is not sent to the routing service
      walk: 6
      transit: 45
      drive: 80
    max-routed-schools: 160   # at most this many (nearest) schools per routing request; >= the most schools a full snapshot may have (SnapshotValidator.FULL_MAX_SCHOOLS)
