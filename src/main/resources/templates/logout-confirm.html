<!DOCTYPE html>
<!--/* DM 06 LogoutConfirmation — UserProfileUI.selectLogOut / promptLogoutConfirmation (FR-LOGOUT-01..04, DC-03).
       Cancel keeps the session and goes back to the profile (FR-LOGOUT-04, AF-1); Log out posts to /logout. */-->
<!-- DM-06 LogoutConfirmation · UserProfileUI -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Log out')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4 py-md-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
            <div th:replace="~{fragments/messages :: messages}"></div>
            <div class="card">
                <div class="card-body p-4 p-md-5 text-center">
                    <span class="empty-state-icon mb-3"><svg th:replace="~{fragments/icon :: icon('user')}"></svg></span>
                    <h1 class="page-title mb-2">Log out?</h1>
                    <p class="text-body-secondary mb-4">You will need to log in again to see your shortlist and plan.</p>
                    <form method="post" th:action="@{/logout}" class="d-flex justify-content-center gap-2">
                        <a class="btn btn-outline-secondary col" th:href="@{/profile}">Cancel</a>
                        <button type="submit" class="btn btn-danger col">Log out</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
