<!DOCTYPE html>
<!--/* DM 03 RegistrationForm — RegisterUI.displayRegistrationForm / submitRegistration (FR-REG-01..05, NFR-SEC-04).
       Model: form (RegisterUI.RegistrationForm; passwords are never sent back), fieldErrors (highlightInvalidFields),
       optional flashError (EX-1). */-->
<!-- DM-03 RegistrationForm · RegisterUI -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Register')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <h1 class="h3 mb-3">Create an account</h1>
            <div th:replace="~{fragments/messages :: messages}"></div>
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form method="post" th:action="@{/register}" th:object="${form}" novalidate>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input id="username" type="text" name="username" th:value="*{username}" class="form-control"
                                   required maxlength="30" autocomplete="username" aria-describedby="username-help"
                                   th:classappend="${fieldErrors?.get('username') != null} ? 'is-invalid'">
                            <div class="invalid-feedback" th:text="${fieldErrors?.get('username')}">Error</div>
                            <div id="username-help" class="form-text">3–30 letters, digits or underscores (_).</div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input id="email" type="email" name="email" th:value="*{email}" class="form-control"
                                   required maxlength="254" autocomplete="email"
                                   th:classappend="${fieldErrors?.get('email') != null} ? 'is-invalid'">
                            <div class="invalid-feedback" th:text="${fieldErrors?.get('email')}">Error</div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input id="password" type="password" name="password" class="form-control" required
                                   maxlength="64" autocomplete="new-password" aria-describedby="password-help"
                                   th:classappend="${fieldErrors?.get('password') != null} ? 'is-invalid'">
                            <div class="invalid-feedback" th:text="${fieldErrors?.get('password')}">Error</div>
                            <div id="password-help" class="form-text">
                                8–64 characters with an upper-case letter, a lower-case letter and a digit.
                                English letters, digits, spaces and keyboard symbols only.
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="confirm" class="form-label">Confirm password</label>
                            <input id="confirm" type="password" name="confirm" class="form-control" required
                                   maxlength="64" autocomplete="new-password"
                                   th:classappend="${fieldErrors?.get('confirm') != null} ? 'is-invalid'">
                            <div class="invalid-feedback" th:text="${fieldErrors?.get('confirm')}">Error</div>
                        </div>
                        <div class="d-flex gap-2">
                            <a class="btn btn-outline-secondary" th:href="@{/}">Cancel</a>
                            <button type="submit" class="btn btn-primary flex-grow-1">Create account</button>
                        </div>
                    </form>
                </div>
            </div>
            <p class="text-center small mt-3">Already registered? <a th:href="@{/login}">Log in</a></p>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
