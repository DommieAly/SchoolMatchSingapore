<!DOCTYPE html>
<!--/* DM 02 LoginForm — LoginUI.displayLoginForm / submitLogin (FR-LOGIN-01..05, NFR-SEC-04, DC-08).
       Model: next (safe local path or null), add (school code or null), sessionEnded (sent here from an expired
       logout), fieldErrors (flash: identifier / password / login), identifier (flash: what was typed),
       flashMessage, flashError. */-->
<!-- DM-02 LoginForm · LoginUI -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Log in')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4 py-md-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
            <header class="page-header text-center">
                <h1 class="page-title">Log in</h1>
                <p class="page-subtitle">See your shortlist, plan and recommendations.</p>
            </header>
            <div th:if="${sessionEnded}" class="alert alert-info small" role="status">
                Your session had already ended, so you are already logged out.
            </div>
            <div th:replace="~{fragments/messages :: messages}"></div>
            <div th:if="${add != null}" class="alert alert-info small" role="status">
                Log in to finish adding the school to your shortlist.
            </div>
            <div class="card">
                <div class="card-body p-4">
                    <form method="post" th:action="@{/login}" novalidate
                          th:with="identifierError=${fieldErrors?.get('identifier')},
                                   passwordError=${fieldErrors?.get('password')}">
                        <input th:if="${next != null}" type="hidden" name="next" th:value="${next}">
                        <input th:if="${add != null}" type="hidden" name="add" th:value="${add}">
                        <div class="mb-3">
                            <label for="identifier" class="form-label">Username or email</label>
                            <input id="identifier" type="text" name="identifier" th:value="${identifier}"
                                   class="form-control" required maxlength="254" autocomplete="username" autofocus
                                   th:classappend="${identifierError != null} ? 'is-invalid'"
                                   th:aria-invalid="${identifierError != null} ? 'true'"
                                   th:aria-describedby="${identifierError != null} ? 'identifier-error'">
                            <div id="identifier-error" class="invalid-feedback" th:text="${identifierError}">Error</div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input id="password" type="password" name="password" class="form-control" required
                                   autocomplete="current-password"
                                   th:classappend="${passwordError != null} ? 'is-invalid'"
                                   th:aria-invalid="${passwordError != null} ? 'true'"
                                   th:aria-describedby="${passwordError != null} ? 'password-error'">
                            <div id="password-error" class="invalid-feedback" th:text="${passwordError}">Error</div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Log in</button>
                            <a class="btn btn-outline-secondary" th:href="@{/}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
            <p class="text-center mt-3 mb-0">No account yet? <a class="fw-semibold" th:href="@{/register}">Register</a></p>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
