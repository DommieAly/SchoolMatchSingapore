<!DOCTYPE html>
<!--/* DM 21 Directions — DirectionsUI.selectTravelMode, displayDirections (FR-ROUTE-07, DC-05).
       Model: to, from, destination (School or Facility), destinationFromGoogle (it is a Facility), destinationUrl,
       startLocation, mode, modeLabel, modes (ModeOption list with url), route, distanceKm ("2.4"), durationText
       ("12 min"), steps (StepView list), changeUrl, cancelUrl, interactive, markersJson (start + destination),
       routePolyline (only with an interactive map). */-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Directions')}"></head>
<body>
<!-- DM-21 Directions · DirectionsUI -->
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <header class="page-header">
        <a class="back-link" th:href="${changeUrl}"><svg
                th:replace="~{fragments/icon :: icon('arrow-left')}"></svg>Change starting point or travel mode</a>
        <h1 class="page-title">Directions</h1>
        <p class="page-subtitle">
            To <a th:href="${destinationUrl}" class="fw-semibold" th:text="${destination.name}">school</a>
        </p>
        <p class="page-subtitle small">
            From <span th:text="${startLocation.inputText != null ? startLocation.inputText : 'your starting point'}">start</span>
        </p>
    </header>
    <div th:replace="~{fragments/messages :: messages}"></div>

    <!--/* selectTravelMode: switch mode without entering the start again (the overlay shows while it loads) */-->
    <ul class="nav nav-pills mb-4" aria-label="Travel mode">
        <li class="nav-item" th:each="option : ${modes}">
            <a class="nav-link" th:classappend="${option.mode == mode} ? 'active'"
               th:aria-current="${option.mode == mode} ? 'page'"
               th:href="${option.url}" data-loading="Finding the route…"
               th:text="${option.label}">Walk</a>
        </li>
    </ul>

    <div class="row g-4">
        <!--/* without an interactive map the route summary is the main content: it comes first and gets the wide column */-->
        <div class="col-12" th:classappend="${interactive} ? 'col-lg-5 order-lg-2' : 'col-lg-7'">
            <!--/* displayDirections (FR-ROUTE-07): distance, duration, steps */-->
            <section class="card">
                <div class="card-body">
                    <div class="stat-grid mb-4">
                        <div class="stat">
                            <span class="stat-value"><span th:replace="~{fragments/value :: value(${durationText})}"></span></span>
                            <span class="stat-label" th:text="|Travel time · ${modeLabel}|">Travel time · Walk</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value"><span
                                    th:replace="~{fragments/value :: value(${distanceKm != null ? distanceKm + ' km' : null})}"></span></span>
                            <span class="stat-label">Distance</span>
                        </div>
                    </div>
                    <h2 class="section-title">Steps</h2>
                    <ol class="list-group list-group-numbered mb-0">
                        <li class="list-group-item d-flex justify-content-between align-items-start gap-3"
                            th:each="step : ${steps}">
                            <span class="me-auto">
                                <span th:replace="~{fragments/value :: value(${step.instruction})}"></span>
                            </span>
                            <span class="small text-body-secondary text-nowrap" th:if="${step.distance != null}"
                                  th:text="${step.distance}">350 m</span>
                        </li>
                    </ol>
                    <p class="note mt-3 mb-0"><svg th:replace="~{fragments/icon :: icon('info')}"></svg><span>
                        Check the route before you travel.</span></p>
                    <p th:if="${googleStub}" class="small mt-2 mb-0">
                        <span class="badge-stub">Demo data (stub)</span>
                        Straight-line estimate, not real directions.
                    </p>
                    <!--/* DC-88: the time, distance and steps are Google's and sit outside the map. DC-93: a facility's name is too */-->
                    <th:block th:if="${destinationFromGoogle}">
                        <p th:replace="~{fragments/google-maps-credit :: placesCredit('Route', ${destination.attributions})}"></p>
                    </th:block>
                    <th:block th:unless="${destinationFromGoogle}">
                        <p th:replace="~{fragments/google-maps-credit :: credit('Route')}"></p>
                    </th:block>
                </div>
            </section>
            <a class="btn btn-outline-secondary mt-3" th:href="${cancelUrl}"
               th:text="|Back to ${destination.name}|">Back to the school</a>
        </div>
        <div class="col-12 col-lg-7" th:classappend="${interactive} ? 'order-lg-1'">
            <!--/* the map draws Route.encodedPolyline (DC-05) between the start (A) and the destination */-->
            <div th:replace="~{fragments/map-canvas :: mapCanvas(${markersJson}, ${interactive})}"></div>
        </div>
    </div>
    <div th:replace="~{fragments/loading :: loading('Finding the route…')}"></div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
