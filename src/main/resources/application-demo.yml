# Demo / presentation run: its own H2 file (schoolmatch-demo; the older .local/h2/demo was made by Hibernate and is
# no longer used). Google mode comes from GOOGLE_MODE in .env, like dev:
# set GOOGLE_MODE=live (and the keys) in .env on the demo laptop. The "live" default below only applies
# when GOOGLE_MODE is not set at all (no .env); live then needs GOOGLE_MAPS_SERVER_KEY or start-up stops.
spring:
  datasource:
    url: jdbc:h2:file:./.local/h2/schoolmatch-demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""

app:
  external:
    google:
      mode: ${GOOGLE_MODE:live}
